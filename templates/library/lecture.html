{% extends 'base.html' %}
{% load static %}

{% block title %}Lecture - {{ livre.titre }}{% endblock %}

{% block content %}
<div class="container-fluid py-3" style="min-height: 85vh;">
    <div class="d-flex justify-content-between align-items-center mb-2 px-2">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{% url 'library:liste' %}">Bibliothèque</a></li>
                <li class="breadcrumb-item"><a href="{% url 'library:detail' livre.id %}">{{ livre.titre }}</a></li>
                <li class="breadcrumb-item active" aria-current="page">Lecture</li>
            </ol>
        </nav>
        <div class="btn-group">
            <a href="{% url 'library:download' livre.id %}" class="btn btn-outline-primary btn-sm" download>
                <i class="bi bi-download"></i> Télécharger
            </a>
            <button class="btn btn-outline-dark btn-sm" onclick="toggleFullScreen()">
                <i class="bi bi-arrows-fullscreen"></i> Plein écran
            </button>
        </div>
    </div>

    {% if is_pdf %}
    <!-- Lecteur PDF natif (comme Chrome) -->
    <iframe id="pdf-iframe"
            src="{% url 'library:download' livre.id %}#toolbar=1&navpanes=0"
            style="width: 100%; height: 85vh; border: none; border-radius: 8px;"
            title="Lecture de {{ livre.titre }}">
    </iframe>
    {% else %}
    <!-- Texte brut -->
    <div class="overflow-auto bg-white p-5 rounded shadow-sm" style="height: 85vh;">
        <div class="container" style="max-width: 800px;">
            <h2 class="mb-4">{{ livre.titre }}</h2>
            <pre style="white-space: pre-wrap; font-family: 'Georgia', serif; font-size: 1.1rem; line-height: 1.8; color: #333;">{{ content }}</pre>
        </div>
    </div>
    {% endif %}
</div>

<script>
function toggleFullScreen() {
    const iframe = document.getElementById('pdf-iframe');
    if (iframe) {
        if (iframe.requestFullscreen) {
            iframe.requestFullscreen();
        } else if (iframe.webkitRequestFullscreen) {
            iframe.webkitRequestFullscreen();
        }
    }
}
</script>
{% endblock %}

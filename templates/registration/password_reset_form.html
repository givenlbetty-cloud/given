{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Réinitialiser le mot de passe - ATJ{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5 atj-auth-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-6">
                <div class="card atj-auth-card border-0 rounded-4">
                    <div class="atj-auth-header" style="padding: 2rem; text-align: center; border-radius: 20px 20px 0 0;">
                        <i class="bi bi-key-fill" style="font-size: 2.5rem;"></i>
                        <h1 class="h4 fw-bold mt-3 mb-2">Mot de passe oublié ?</h1>
                        <p class="mb-0 opacity-90 small">Entrez votre email pour recevoir un lien de réinitialisation</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form method="post">
                            {% csrf_token %}
                            {{ form|crispy }}
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                                    <i class="bi bi-envelope me-2"></i>Envoyer le lien
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-3">
                            <a href="{% url 'login' %}" class="text-decoration-none small text-muted">
                                <i class="bi bi-arrow-left me-1"></i>Retour à la connexion
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

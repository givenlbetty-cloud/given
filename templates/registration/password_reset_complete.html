{% extends 'base.html' %}
{% block title %}Mot de passe changé - ATJ{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5" style="background: linear-gradient(135deg, #f5f7fa 0%, #f5e6e6 100%);">
    <div class="card border-0 shadow-lg rounded-4 p-5 text-center" style="max-width: 500px;">
        <i class="bi bi-shield-check-fill text-success" style="font-size: 4rem;"></i>
        <h2 class="fw-bold mt-3">Mot de passe changé !</h2>
        <p class="text-muted">Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter.</p>
        <a href="{% url 'login' %}" class="btn btn-lg rounded-pill fw-bold text-white mt-3" style="background: #60100f;">
            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
        </a>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Mot de passe changé - ATJ{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5 atj-auth-page">
    <div class="card atj-auth-card border-0 rounded-4 p-5 text-center" style="max-width: 500px;">
        <i class="bi bi-shield-check-fill text-success" style="font-size: 4rem;"></i>
        <h2 class="fw-bold mt-3">Mot de passe changé !</h2>
        <p class="text-muted">Votre mot de passe a été modifié avec succès. Vous pouvez maintenant vous connecter.</p>
        <a href="{% url 'login' %}" class="btn btn-primary btn-lg rounded-pill fw-bold mt-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
        </a>
    </div>
</div>
{% endblock %}
